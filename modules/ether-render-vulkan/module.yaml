description: "Real Vulkan rendering backend for linuxX64 - dynamic loader, device bring-up, and GPU execution."

product:
  type: kmp/lib
  platforms: [ linuxX64 ]

dependencies:
  - ../ether-render-api:
      exported: true

test-dependencies:
  - ../ether-testing
  - ../ether-render-core

repositories:
  - url: mavenLocal
    publish: true

settings:
  kotlin:
    explicitApi: strict
  publishing:
    enabled: true
    group: dev.instrum.ether
    artifactId: ether-render-vulkan
    version: 0.1.0
